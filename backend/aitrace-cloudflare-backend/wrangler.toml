name = "aitrace-cloudflare-backend"
main = "src/index.ts"
compatibility_date = "2026-08-21"

[vars]
OSS_ENDPOINT = "oss-cn-shanghai.aliyuncs.com"
OSS_BUCKET = "mwintrack"
OSS_MAX_RAW_SIZE_BYTES = "8388608"
OSS_MAX_STORED_SIZE_BYTES = "8388608"
TELEMETRY_MAX_REQUEST_SIZE_BYTES = "16777216"

[[d1_databases]]
binding = "DB"
database_name = "aitrace"
database_id = "replace-with-cloudflare-d1-id"


[assets]
directory = "../../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
