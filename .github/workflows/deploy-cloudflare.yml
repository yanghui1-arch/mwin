name: Cloudflare CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "backend/aitrace-cloudflare-backend/**"
      - "web/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "backend/aitrace-cloudflare-backend/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  MWIN_APP_URL: ${{ vars.MWIN_APP_URL || 'https://aitrace-cloudflare-backend.mwin-172f8144.workers.dev' }}
  MWIN_GITHUB_CLIENT_ID: ${{ vars.MWIN_GITHUB_CLIENT_ID || 'Ov23liWyhyfoA5aDkDQx' }}

jobs:
  cloudflare-backend-ci:
    name: Cloudflare Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: backend/aitrace-cloudflare-backend
        run: npm install --no-audit --no-fund

      - name: Type-check backend
        working-directory: backend/aitrace-cloudflare-backend
        run: npm run typecheck

      - name: Run backend tests
        working-directory: backend/aitrace-cloudflare-backend
        run: npm test

  web-ci:
    name: Web CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint web
        working-directory: web
        run: npm run lint -- --max-warnings=0

      - name: Build production web
        working-directory: web
        env:
          VITE_API_BASE_URL: /api
          VITE_GITHUB_CLIENT_ID: ${{ env.MWIN_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ env.MWIN_APP_URL }}/auth/github/callback
        run: npm run build

      - name: Upload production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwin-web-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    name: Deploy Production
    if: github.event_name != 'pull_request'
    needs:
      - cloudflare-backend-ci
      - web-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: mwin-cloudflare-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.cloudflare.outputs.app_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download tested web artifact
        uses: actions/download-artifact@v4
        with:
          name: mwin-web-${{ github.sha }}
          path: web/dist

      - name: Resolve Cloudflare resources
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

          api_request() {
            local method="$1"
            local endpoint="$2"
            local data="${3:-}"
            local body_file status errors
            body_file="$(mktemp)"
            local curl_args=(
              --silent
              --show-error
              --output "${body_file}"
              --write-out "%{http_code}"
              --request "${method}"
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
              --header "Content-Type: application/json"
            )
            if [[ -n "${data}" ]]; then
              curl_args+=(--data "${data}")
            fi
            status="$(curl "${curl_args[@]}" "https://api.cloudflare.com/client/v4/${endpoint}")"
            if [[ ! "${status}" =~ ^2 ]] || ! jq -e '.success == true' "${body_file}" >/dev/null 2>&1; then
              errors="$(jq -c '[.errors[]? | {code, message}]' "${body_file}" 2>/dev/null || printf '"unparseable response"')"
              echo "::error::Cloudflare API request to ${endpoint} failed (HTTP ${status}): ${errors}" >&2
              rm -f "${body_file}"
              return 1
            fi
            cat "${body_file}"
            rm -f "${body_file}"
          }

          api_get() {
            api_request GET "$1"
          }

          api_post() {
            api_request POST "$1" "$2"
          }

          api_put() {
            api_request PUT "$1" "$2"
          }

          api_get "user/tokens/verify" >/dev/null
          ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-}"
          if [[ -z "${ACCOUNT_ID}" ]]; then
            ACCOUNTS_JSON="$(api_get "accounts?per_page=50")"
            ACCOUNT_ID="$(jq -r '.result[0].id // empty' <<<"${ACCOUNTS_JSON}")"
          fi
          if [[ -z "${ACCOUNT_ID}" ]]; then
            echo "::error::No Cloudflare account is visible to CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          DB_JSON="$(api_get "accounts/${ACCOUNT_ID}/d1/database?name=aitrace")"
          DB_ID="$(jq -r '.result[0].uuid // empty' <<<"${DB_JSON}")"
          if [[ -z "${DB_ID}" ]]; then
            DB_JSON="$(api_post "accounts/${ACCOUNT_ID}/d1/database" '{"name":"aitrace"}')"
            DB_ID="$(jq -r '.result.uuid // empty' <<<"${DB_JSON}")"
          fi
          if [[ -z "${DB_ID}" ]]; then
            echo "::error::Unable to resolve or create the aitrace D1 database."
            exit 1
          fi

          if ! SUBDOMAIN_JSON="$(api_get "accounts/${ACCOUNT_ID}/workers/subdomain" 2>/dev/null)"; then
            SUBDOMAIN_CANDIDATE="mwin-${ACCOUNT_ID:0:8}"
            SUBDOMAIN_BODY="$(jq -n --arg subdomain "${SUBDOMAIN_CANDIDATE}" '{subdomain:$subdomain}')"
            SUBDOMAIN_JSON="$(api_put "accounts/${ACCOUNT_ID}/workers/subdomain" "${SUBDOMAIN_BODY}")"
          fi
          WORKERS_SUBDOMAIN="$(jq -r '.result.subdomain // empty' <<<"${SUBDOMAIN_JSON}")"
          if [[ -z "${WORKERS_SUBDOMAIN}" ]]; then
            echo "::error::The Cloudflare account does not have a workers.dev subdomain."
            exit 1
          fi

          APP_URL="https://aitrace-cloudflare-backend.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "account_id=${ACCOUNT_ID}" >> "${GITHUB_OUTPUT}"
          echo "db_id=${DB_ID}" >> "${GITHUB_OUTPUT}"
          echo "app_url=${APP_URL}" >> "${GITHUB_OUTPUT}"

      - name: Configure D1 binding
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/replace-with-cloudflare-d1-id/${{ steps.cloudflare.outputs.db_id }}/" backend/aitrace-cloudflare-backend/wrangler.toml

      - name: Install deployment dependencies
        working-directory: backend/aitrace-cloudflare-backend
        run: npm install --no-audit --no-fund

      - name: Validate Worker bundle
        working-directory: backend/aitrace-cloudflare-backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Apply D1 migrations
        working-directory: backend/aitrace-cloudflare-backend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy tested frontend and backend
        working-directory: backend/aitrace-cloudflare-backend
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${OSS_ACCESS_KEY_ID}" || -z "${OSS_ACCESS_KEY_SECRET}" ]]; then
            echo "::error::OSS_ACCESS_KEY_ID and OSS_ACCESS_KEY_SECRET repository secrets must be configured."
            exit 1
          fi

          WORKER_SECRETS_FILE="$(mktemp)"
          trap 'rm -f "${WORKER_SECRETS_FILE}"' EXIT
          jq -n '{
            OSS_ACCESS_KEY_ID: env.OSS_ACCESS_KEY_ID,
            OSS_ACCESS_KEY_SECRET: env.OSS_ACCESS_KEY_SECRET
          }' > "${WORKER_SECRETS_FILE}"
          chmod 600 "${WORKER_SECRETS_FILE}"
          npx wrangler deploy --secrets-file "${WORKER_SECRETS_FILE}"

      - name: Verify production
        shell: bash
        env:
          APP_URL: ${{ steps.cloudflare.outputs.app_url }}
        run: |
          set -euo pipefail
          CURL_RETRY=(--fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors)

          curl "${CURL_RETRY[@]}" "${APP_URL}/" | grep -qi '<html'

          BACKEND_RESPONSE="$(curl "${CURL_RETRY[@]}" "${APP_URL}/api/does-not-exist")"
          jq -e '.code == 404 and .data == null' <<<"${BACKEND_RESPONSE}" >/dev/null

          TELEMETRY_RESPONSE="$(curl "${CURL_RETRY[@]}" --request POST --header "Content-Type: application/json" --header "Authorization: Bearer invalid-ci-smoke-key" --data '{}' "${APP_URL}/api/v0/log/trace")"
          jq -e '.code == 500 and (.message | contains("Invalid AITrace API key"))' <<<"${TELEMETRY_RESPONSE}" >/dev/null

          {
            echo "## Production deployment"
            echo
            echo "- Application: ${APP_URL}/"
            echo "- API base URL: ${APP_URL}/api"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- D1 database: aitrace"
            echo "- Checks: frontend HTML, API routing, telemetry authentication"
          } >> "${GITHUB_STEP_SUMMARY}"
