services:
  postgres:
    build:
      context: .
      target: postgres
    image: aitrace-postgres:latest
    container_name: aitrace-postgres
    environment:
      POSTGRES_DB: aitrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "16432:5432"
    volumes:
      - aitrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aitrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: backend-runtime
    image: aitrace-backend:latest
    container_name: aitrace-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aitrace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
    ports:
      - "8080:8080"
    volumes:
      - aitrace_media:/data/mwin/media

  web:
    build:
      context: .
      target: web-runtime
    image: aitrace-web:latest
    container_name: aitrace-web
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8080
    ports:
      - "5173:80"

volumes:
  aitrace_pgdata:
  aitrace_media:
